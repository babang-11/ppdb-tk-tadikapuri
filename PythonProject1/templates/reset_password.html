<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PPDB TK Tadika Puri</title>

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 36px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .brand-logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .brand-logo span {
            font-size: 15px;
            font-weight: 700;
            color: #0284c7;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Alert / Flash Message */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: left;
            background-color: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: #1e293b;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control[readonly] {
            background-color: #f1f5f9;
            color: #475569;
            cursor: not-allowed;
        }

        .form-control:focus:not([readonly]) {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .auth-footer {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            font-size: 13.5px;
        }

        .auth-footer a {
            color: #0284c7;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Mobile */
        @media screen and (max-width: 480px) {
            .auth-card {
                padding: 28px 20px;
                border-radius: 16px;
            }
            .auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-logo">
            <img src="{{ url_for('static', filename='image/logo-transparent.png') }}" alt="Logo TK Tadika Puri">
            <span>TK Tadika Puri</span>
        </div>

        <h1 class="auth-title">Buat Password Baru</h1>
        <p class="auth-subtitle">
            Silakan masukkan kata sandi baru untuk mengamankan akun PPDB Anda.
        </p>

        <!-- Menampilkan Pesan Flash dari Flask jika ada -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/reset-password" method="POST">
            <div class="form-group">
                <label for="email">Email Akun</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ request.args.get('email', '') }}" readonly required>
            </div>

            <div class="form-group">
                <label for="password_baru">Password Baru</label>
                <div class="password-wrapper">
                    <input type="password" id="password_baru" name="password_baru" class="form-control" placeholder="Masukkan password baru" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword()">Lihat</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Simpan Password Baru</button>
        </form>

        <div class="auth-footer">
            <a href="/login">← Kembali ke Halaman Login</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password_baru');
            const btn = document.querySelector('.toggle-pw');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Sembunyikan';
            } else {
                input.type = 'password';
                btn.textContent = 'Lihat';
            }
        }
    </script>

</body>
</html>
