<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran PPDB</title>
    <head>

    <title>Login TK Tadika Puri</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-box">

    <h2>🎈 Form Pendaftaran PPDB ☀️</h2>

    <form method="POST"
    enctype="multipart/form-data">

        <!-- IDENTITAS SISWA -->
        <h3>👦 Identitas Siswa</h3>

        <input type="text"
        name="nama_siswa"
        placeholder="Nama Lengkap"
        required>

        <input type="text"
        name="nik"
        placeholder="NIK"
        required>

        <input type="text"
        name="tempat_lahir"
        placeholder="Tempat Lahir"
        required>

        <input type="date"
        name="tanggal_lahir"
        required>

        <select name="jenis_kelamin">

            <option>Laki-laki</option>
            <option>Perempuan</option>

        </select>

        <input type="text"
        name="agama"
        placeholder="Agama">

        <input type="text"
        name="kewarganegaraan"
        placeholder="Kewarganegaraan">

        <textarea name="alamat"
        placeholder="Alamat Lengkap"></textarea>

        <input type="text"
        name="tinggal_bersama"
        placeholder="Tinggal Bersama">

        <input type="number"
        name="anak_ke"
        placeholder="Anak Ke">

        <input type="number"
        name="usia"
        placeholder="Usia">

        <input type="text"
        name="no_hp"
        placeholder="Nomor HP">

        <!-- FOTO -->
        <h3>📸 Upload Foto Siswa</h3>

        <input type="file"
        name="foto"
        required>

        <!-- DATA AYAH -->
        <h3>👨 Data Ayah</h3>

        <input type="text"
        name="nama_ayah"
        placeholder="Nama Ayah">

        <input type="text"
        name="nik_ayah"
        placeholder="NIK Ayah">

        <input type="text"
        name="pendidikan_ayah"
        placeholder="Pendidikan Ayah">

        <input type="text"
        name="pekerjaan_ayah"
        placeholder="Pekerjaan Ayah">

        <!-- DATA IBU -->
        <h3>👩 Data Ibu</h3>

        <input type="text"
        name="nama_ibu"
        placeholder="Nama Ibu">

        <input type="text"
        name="nik_ibu"
        placeholder="NIK Ibu">

        <input type="text"
        name="pendidikan_ibu"
        placeholder="Pendidikan Ibu">

        <input type="text"
        name="pekerjaan_ibu"
        placeholder="Pekerjaan Ibu">

        <!-- DATA PERIODIK -->
        <h3>📚 Data Periodik</h3>

        <input type="number"
        name="tinggi_badan"
        placeholder="Tinggi Badan">

        <input type="number"
        name="berat_badan"
        placeholder="Berat Badan">

        <input type="text"
        name="jarak_tempuh"
        placeholder="Jarak Tempuh">

        <input type="number"
        name="jumlah_saudara"
        placeholder="Jumlah Saudara">

        <!-- REGISTRASI -->
        <h3>📝 Registrasi</h3>

        <select name="jenis_pendaftaran">

            <option>Siswa Baru</option>
            <option>Pindahan</option>

        </select>

        <input type="date"
        name="tgl_masuk">

        <input type="text"
        name="no_induk"
        placeholder="No Induk Siswa">

        <select name="rombel">


            <option>TK A</option>
            <option>TK B</option>
            <option>Kelompok A</option>
            <option>Kelompok B</option>

        </select>

        <button type="submit">

            💾 Simpan Pendaftaran

        </button>

    </form>

</div>

</body>
</html>
