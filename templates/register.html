<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <head>
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
    <title>Login TK Tadika Puri</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-box">

    <h2>Register</h2>

    <form method="POST">

        <input type="text"
        name="nama"
        placeholder="Nama Lengkap"
        required>

        <input type="email"
        name="email"
        placeholder="Email"
        required>

        <input type="password"
        name="password"
        placeholder="Password"
        required>

        <input type="text"
        name="no_hp"
        placeholder="Nomor HP"
        required>

        <button type="submit">
            Daftar
        </button>

    </form>

</div>

</body>
</html>
